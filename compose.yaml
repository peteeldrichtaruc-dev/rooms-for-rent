services:
    app:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        container_name: rooms_app
        restart: unless-stopped
        working_dir: /var/www/html
        ports:
            - "5173:5173"
        volumes:
            - .:/var/www/html
        networks:
            - rooms-network
        depends_on:
            - postgres
            - redis

    webserver:
        image: nginx:alpine
        container_name: rooms_webserver
        restart: unless-stopped
        ports:
            - "8080:80"
        volumes:
            - .:/var/www/html
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
        networks:
            - rooms-network
        depends_on:
            - app

    postgres:
        image: postgres:16-alpine
        container_name: rooms_postgres
        restart: unless-stopped
        environment:
            POSTGRES_DB: ${DB_DATABASE:-rooms_for_rent}
            POSTGRES_USER: ${DB_USERNAME:-postgres}
            POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
        ports:
            - "5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
        networks:
            - rooms-network

    redis:
        image: redis:alpine
        container_name: rooms_redis
        restart: unless-stopped
        ports:
            - "6379:6379"
        volumes:
            - redis_data:/data
        networks:
            - rooms-network

networks:
    rooms-network:
        driver: bridge

volumes:
    postgres_data:
        driver: local
    redis_data:
        driver: local

services:
    app:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        container_name: rooms_app
        restart: unless-stopped
        working_dir: /var/www/html
        command: php-fpm
        ports:
            - "5173:5173"
        volumes:
            - .:/var/www/html
        networks:
            - rooms-network
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
        healthcheck:
            test: [ "CMD-SHELL", "php-fpm -t || exit 1" ]
            interval: 5s
            timeout: 3s
            retries: 5
            start_period: 10s

    scheduler:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        container_name: rooms_scheduler
        restart: unless-stopped
        working_dir: /var/www/html
        command: php artisan schedule:work
        volumes:
            - .:/var/www/html
        networks:
            - rooms-network
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy

    queue:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        container_name: rooms_queue
        restart: unless-stopped
        working_dir: /var/www/html
        command: php artisan queue:work redis --tries=3 --timeout=90
        volumes:
            - .:/var/www/html
        networks:
            - rooms-network
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy

    webserver:
        image: nginx:alpine
        container_name: rooms_webserver
        restart: unless-stopped
        ports:
            - "8080:80"
        volumes:
            - .:/var/www/html
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
        networks:
            - rooms-network
        depends_on:
            - app

    postgres:
        image: postgres:16-alpine
        container_name: rooms_postgres
        restart: unless-stopped
        environment:
            POSTGRES_DB: ${DB_DATABASE:-rooms_for_rent}
            POSTGRES_USER: ${DB_USERNAME:-postgres}
            POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
        ports:
            - "5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
        networks:
            - rooms-network
        healthcheck:
            test: [ "CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_DATABASE:-rooms_for_rent}" ]
            interval: 5s
            timeout: 5s
            retries: 5
            start_period: 5s

    redis:
        image: redis:alpine
        container_name: rooms_redis
        restart: unless-stopped
        ports:
            - "6379:6379"
        volumes:
            - redis_data:/data
        networks:
            - rooms-network
        healthcheck:
            test: [ "CMD", "redis-cli", "ping" ]
            interval: 5s
            timeout: 3s
            retries: 5
            start_period: 5s

networks:
    rooms-network:
        driver: bridge

volumes:
    postgres_data:
        driver: local
    redis_data:
        driver: local
